name: Source preflight
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only source gate
        run: python3 -m unittest discover -s tests -v
      - name: Compile host tooling
        run: python3 -m compileall -q tools tests
      - name: Test legacy save-state deletion adapter
        run: |
          mkdir -p artifacts/state-delete-test
          g++ -std=c++98 -Wall -Wextra -pedantic tests/state_delete_compat.cpp -o artifacts/state-delete-test/slot-test
          cd artifacts/state-delete-test
          ./slot-test
  owner-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner archive (must pass before import)
        run: python3 tools/verify_source_overlay.py
